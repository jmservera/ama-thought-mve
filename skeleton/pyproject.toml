[project]
name = "workbench"
version = "0.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# Frozen lint configuration for the experiment: change it only before the pilot.
[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "B", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 10
